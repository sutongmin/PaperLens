
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperLens - 论文速读助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">PaperLens</div>
        <nav>
            <a href="#">首页</a>
            <a href="#analyzer">论文分析</a>
            <a href="#about">关于我们</a>
        </nav>
    </header>

    <main class="container">

        <section class="hero">
            <h1>让论文阅读变得更简单</h1>
            <p>智能提取关键词，快速理解论文核心内容</p>
        </section>

        <section class="analyzer" id="analyzer">
            <h2>论文内容分析</h2>
            <p>请在下方粘贴论文摘要或正文</p>

            <textarea
                id="paperInput"
                placeholder="请在这里粘贴论文内容..."
            ></textarea>

            <div class="input-info">
                <span>支持中文和英文文本</span>
                <span id="wordCount">0 字</span>
            </div>

            <button id="analyzeBtn">开始分析</button>
        </section>

        <section class="results" id="results">
            <h2>分析结果</h2>

            <div class="result-card">
                <h3>关键词提取</h3>
                <div id="keywords">
                    <p>等待分析...</p>
                </div>
            </div>

            <div class="result-card">
                <h3>论文内容概览</h3>
                <p id="summary">等待分析...</p>
            </div>

            <div class="result-card">
                <h3>阅读时间估算</h3>
                <p id="readingTime">等待分析...</p>
            </div>
        </section>
    <!-- 历史记录区域 -->
        <section class="history" id="history">
            <div class="history-header">
                <h2>历史分析记录</h2>
                <button id="clearHistoryBtn" class="clear-btn">
                    清空记录
                </button>
            </div>

            <div id="historyList">
                <p class="empty-history">暂无分析记录</p>
            </div>
        </section>
    </main>
    
    <footer id="about">
        <p>PaperLens © 2026 论文速读与关键词提取助手</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
